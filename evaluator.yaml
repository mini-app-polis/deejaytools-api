# deejaytools-api / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: api-service

exemptions:
  - rule: API-011
    reason: >-
      Database migrations use Drizzle ORM and run at Railway deploy time via the service's release hook, not in ci.yml — see docs/decisions/ADR-001-drizzle-migrations-at-deploy.md. The check's 'drizzle-kit push/migrate in ci.yml' requirement is a different migration-timing decision than this repo's.

  - rule: API-004
    reason: >-
      Effective route /internal/tick is intentionally unversioned — it is a
      manual/optional trigger for the tick (session-status advance + queue
      auto-fill). The in-process scheduler started from index.ts is the
      primary driver; this endpoint must stay reachable at a stable
      version-independent path for operators or external monitors.
      Authentication is via the TICK_SECRET header check, not Clerk. All
      substantive API routes are mounted under /v1/. See src/app.ts for the
      inline intent marker.

  - rule: API-006
    reason: >-
      Floor-trial entities (events, sessions, session_divisions, checkins,
      queue_entries, runs, queue_events, event_division_run_limits) are
      admin-managed shared resources, not per-user-owned. They don't fit
      any of API-006's three patterns (owner_id, user_id, relationship
      table). created_by is recorded for audit, not authorisation.
      See docs/decisions/ADR-004-floor-trial-queue-model.md
      for the full rationale. To remove this exemption, API-006 would
      need a fourth pattern explicitly modelling "admin-managed shared
      resource" — a standards-repo change.

  - rule: CD-030
    reason: >-
      Not applicable: this API has no machine callers. Its one caller is the
      deejaytools.com React app, which sends Clerk session JWTs, and there
      are no plans for machines (cogs, services, scheduled jobs) to call it,
      so there is no machine-key set to configure. The human half, CD-029,
      still applies and is graded. See
      docs/decisions/ADR-003-jwt-only-clerk-verification.md. If a machine
      caller is ever planned, remove this exemption, add a named-machine-key
      verifier to src/middleware/auth.ts (routed by dot count, constant-time
      comparison against the machines this API declares), and document
      <MACHINE_NAME>_API_KEY in .env.example.

# TEST-001/002/004 covered by api-service type scoping.
